name: Build standalone binaries

# Compiled binaries (plus a double-click Windows installer) are published
# to this repo's own GitHub Releases for anyone who wants to run the app
# without a Python install. install.sh / install.ps1 download from there.
#
# A `v*` tag builds and publishes; a manual run (workflow_dispatch) only
# builds, so the binaries can be test-downloaded from the run's artifacts
# without cutting a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: bible-linux-x86_64
          - os: windows-latest
            asset_name: bible-windows-x86_64.exe
          - os: macos-14
            asset_name: bible-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf

      - name: Install project and Nuitka
        run: pip install -e ".[packaging]"

      - name: Build with Nuitka
        run: >
          python -m nuitka
          --onefile
          --output-dir=dist
          --output-filename=bible
          --include-data-file=bible_tui/data/schema.sql=bible_tui/data/schema.sql
          --include-data-file=bible_tui/ui/themes.tcss=bible_tui/ui/themes.tcss
          --include-data-file=packaging/seed/bible.db=seed/bible.db
          --assume-yes-for-downloads
          --remove-output
          packaging/entry_point.py

      - name: Collect the built binary under its release name
        shell: bash
        run: |
          mkdir -p out
          if [ -f dist/bible.exe ]; then
            cp dist/bible.exe "out/${{ matrix.asset_name }}"
          else
            cp dist/bible "out/${{ matrix.asset_name }}"
          fi

      # Proves the bundled seed database made it in: a fresh machine with
      # no config at all should still be able to look up a verse.
      - name: Smoke-test the binary
        shell: bash
        run: |
          output="$("out/${{ matrix.asset_name }}" read "John 3:16")"
          echo "$output"
          echo "$output" | grep -q "God so loved the world"

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          & $iscc "/DAppVersion=$version" "/DSourceExe=$PWD\dist\bible.exe" "/O$PWD\out" packaging\windows\bible.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/*

  publish:
    needs: build
    # Publish whatever platforms actually finished - one slow or failed
    # matrix leg (Windows has historically been the slow one) shouldn't
    # hold back the others. `!cancelled()` skips only if you cancel the
    # whole run yourself; a leg failing still lets this run. Manual runs
    # stop at the artifacts.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish binaries to this repo's Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts produced by any matrix leg - nothing to publish."
            exit 1
          fi
          # Idempotent for a re-run against the same tag: upload to an
          # existing release if there is one, otherwise create it.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$REPO" \
              --title "bible $TAG" \
              --notes "Windows: download **bible-windows-x86_64-setup.exe** and double-click it. macOS/Linux: see the README's one-line install." \
              --latest
          fi
